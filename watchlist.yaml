# SF DPH Revenue Integrity - source watchlist. v1.7
# Toggle a whole program with `enabled:`; run a subset with --programs.
#
# Entry types: pdf | html | binary | linkpage | bulletin_probe |
#              manual_list | revision_watch
# Fields:
#   expect_shell: true  known client-rendered page; watched for shell change
#                       but labeled blind to content.
#   manual: true        cannot be fetched automatically; reports MANUAL_REVIEW
#                       every run. Use only when the standing reminder is
#                       worth the noise.
#   human_url           landing page a reader should open when `url` is a
#                       direct file download. The checker still fetches `url`.
#   registry_keys /     registry rows to re-verify when this source changes
#   registry_note       (v1.5 rename of master_*; the code reads both).
#
# ADMISSION RULE: an entry earns its place only if it can report something a
# person would act on. An entry returning the identical status every run
# trains people to ignore the dashboard, which costs more than the coverage
# it pretends to give.
#
# Removed under that rule, with the evidence (git history has the configs):
#   fpact_ppbi_landing, fpact_wic_24005, ffs_wic_14105_201,
#   fqhc_wic_14132_100, fqhc_ecfr_405_subpart_x - permanent MANUAL_REVIEW.
#     leginfo robots.txt and the eCFR bot wall block fetches by design; the
#     PPBI landing page redirects off-site. Statute and CFR changes arrive
#     through MCSS, program news and bill tracking. eCFR publishes a public
#     API for Title 42 Part 405 - that is the route back to automated watch.
#   fpact_bulletin_probe - permanent PROBE_INCONCLUSIVE. The portal is
#     client-rendered, so probing issue N+1 returns an empty shell whether or
#     not the issue exists. MCSS detects bulletins.
#   ffs_tri_page - brittle link diffing. The regex only ever matched three
#     URLs (two fee schedules plus a footer PDF) because every other document
#     uses the /file/<slug>-pdf/ redirect form. All three vanished 2026-07-17
#     and returned identical 2026-07-20: a flapping fetch, not a change.
#     Replaced by watching the two fee schedules directly as binary entries.
#   mcp_apl_index kept, but its link_pattern was dropped - it never matched
#     an actual All Plan Letter. Text hash only.
#
# OPEN, no entry holds it: WIC 14132.100 was amended by AB 116 effective
# 2026-07-01. Verify the PPS-billable provider list by hand against the
# fqhc-billing reference.

programs:

  fpact:
    enabled: true
    entries:
      - id: fpact_news_archive
        type: linkpage
        url: https://familypact.org/news-and-updates-archive/
        link_pattern: 'href="(https://familypact\.org/(?!wp-json|feed|comments)[^"#?]+(?:/|\.pdf))"'
        note: Program news archive; new post or PDF links = policy updates to
          read. Pattern excludes feed/json noise. Also catches re-versioned
          artifacts (e.g. a new Superbill filename).
        registry_note: triage per announcement

      - id: fpact_manual_docs
        type: manual_list
        method: POST
        url: https://mcweb.apps.prd.cammis.medi-cal.ca.gov/graphql
        asset_base: "https://mcweb.apps.prd.cammis.medi-cal.ca.gov"
        portal_page: https://mcweb.apps.prd.cammis.medi-cal.ca.gov/publications/manual?community=family-pact
        seed_csv: data/seeds/fpact_manuals_seed_2026-07-16.csv
        # Directus GraphQL. communityId 25 = Family PACT. The aggregate is a
        # truncation tripwire: parsed docs must equal manuals_aggregated.count.
        graphql_body:
          operationName: CommunityManuals
          variables:
            communityId: "25"
          query: >-
            query CommunityManuals($communityId: GraphQLStringOrFloat) {
            manuals(filter: {community: {communities_id: {id: {_eq:
            $communityId}}}}, sort: ["file.filename_download"], limit: -1) { id
            title file { id filename_download modified_on } }
            manuals_aggregated(filter: {community: {communities_id: {id: {_eq:
            $communityId}}}}) { count { id } } }
        # Bearer token required. It is a STATIC PUBLIC read-only token that
        # mcweb serves anonymously in /environment.js, not a personal or
        # session credential. MCWEB_TOKEN is preferred; if unset or rotated
        # the checker re-reads token_bundle_url. Never put the token here.
        auth_header_env: MCWEB_TOKEN
        token_bundle_url: https://mcweb.apps.prd.cammis.medi-cal.ca.gov/environment.js
        token_bundle_re: 'window\.DIRECTUS_TOKEN\s*=\s*"([^"]+)"'
        note: Per-document monitor for all 24 Family PACT manual sections.
          Each section is watched individually - full PDF text hash, per-page
          "Page updated" stamps, portal Revision Date, new sections
          auto-discovered, removals flagged - and a CHANGED section gets a
          before/after text diff. If the token ever grants the list but not
          the assets, the entry degrades to CHANGED_METADATA_ONLY rather than
          going blind. The endpoint is undocumented and can change shape or
          auth without notice, so MCSS email stays the backstop detector.
          Decision support, not a source of record.
        registry_note: ppbi_source_section rows for any changed section

  medi_cal_ffs:
    enabled: true
    entries:
      # Watched as file hashes rather than through the TRI landing page.
      # Verified 2026-07-24: these URLs carry no version - "2025/10" is the
      # WordPress upload folder, and DHCS puts the version in the link text
      # ("v1.07.02072025"). A re-issue either overwrites the same URL, which
      # the byte hash catches, or moves, which reports UNREACHABLE - the
      # signal to open the landing page and repoint the entry.
      - id: ffs_tri_fee_schedule
        type: binary
        url: https://www.dhcs.ca.gov/wp-content/uploads/2025/10/CY-2024-TRI-Fee-Schedule-Feb.xlsx
        human_url: https://www.dhcs.ca.gov/medi-cal-targeted-provider-rate-increases-and-investments/
        note: CY 2024 Targeted Rate Increase fee schedule - the code list and
          rates for primary care, obstetric and non-specialty mental health
          services. Rates stay in effect until further notice (Prop 35), so
          a content change here is a real rate or code-list change.
        registry_note: reimbursement_basis rows citing TRI

      - id: ffs_sb94_fp_fee_schedule
        type: binary
        url: https://www.dhcs.ca.gov/wp-content/uploads/2025/10/SB94-Family-Planning-Services-Fee-Schedule.xlsx
        human_url: https://www.dhcs.ca.gov/medi-cal-targeted-provider-rate-increases-and-investments/
        note: SB 94 comprehensive family-planning fee schedule (supersedes
          TRI for FP codes with Z30.x). Binary watch - a spreadsheet has no
          extractable text, so this entry reports that the file changed, not
          which rows changed; open it from the landing page to compare.
        registry_note: FPACT rows priced on the SB 94 schedule

  managed_medi_cal:
    enabled: true
    entries:
      - id: mcp_apl_index
        type: html
        url: https://www.dhcs.ca.gov/formsandpubs/Pages/AllPlanLetters.aspx
        note: All Plan Letters index, watched by page text only. APLs are
          served through /file/<slug>-pdf/ redirects rather than direct .pdf
          hrefs, so link diffing was removed 2026-07-24. If the text hash
          proves equally noisy, capture the real APL listing URL from the
          browser and repoint the entry; MCSS Managed Care is the backstop.

      - id: mcp_boilerplate_contract
        type: pdf
        url: https://www.dhcs.ca.gov/hi/wp-content/uploads/2025/10/2024-Managed-Care-Boilerplate-Contract.pdf
        note: Hard-dated versioned filename (2025/10 upload path) - a
          revision likely ships under a new URL, which this entry alone
          cannot see. Treat as a point-in-time watch.

      - id: mcp_tri_faq
        type: pdf
        url: https://www.dhcs.ca.gov/services/Documents/DirectedPymts/CY-2024-TRI-FAQ-20250312.pdf
        note: Hard-dated filename (20250312), so a revision ships under a new
          URL and this entry goes UNREACHABLE rather than CHANGED. Read a 404
          here as "the FAQ was reissued, find it on the TRI landing page".
          This URL also intermittently answers 200 with an HTML bot-check page
          instead of the PDF; that reports UNREACHABLE and keeps the last good
          baseline.

  fqhc:
    enabled: true
    entries:
      - id: fqhc_cms_center
        type: html
        url: https://www.cms.gov/medicare/payment/prospective-payment-systems/federally-qualified-health-centers-fqhc-center
        note: G2025 rate, care-management code set, telehealth expiries.

      - id: fqhc_dhcs_3097_page
        type: html
        url: https://www.dhcs.ca.gov/forms-laws-publications/forms/cost-report-forms-and-documents/
        note: Wrap reconciliation forms and due-date extensions.

      - id: fqhc_rural_manual_docs
        type: manual_list
        method: POST
        url: https://mcweb.apps.prd.cammis.medi-cal.ca.gov/graphql
        asset_base: "https://mcweb.apps.prd.cammis.medi-cal.ca.gov"
        portal_page: https://mcweb.apps.prd.cammis.medi-cal.ca.gov/publications/manual?community=clinics-and-hospitals
        seed_csv: data/seeds/fqhc_rural_manuals_seed_2026-07-17.csv
        # Filtered manual_list (2026-07-17): the RHC/FQHC manual is not its
        # own community on mcweb - the rural* sections sit inside Clinics and
        # Hospitals (communityId 11, 246 docs, too many to watch whole), so
        # this filters filenames starting "rural". ?community=rural was never
        # a valid slug; the SPA slugifies community names.
        graphql_body:
          operationName: RuralManuals
          query: >-
            query RuralManuals { manuals(filter: {file: {filename_download:
            {_starts_with: "rural"}}}, sort: ["file.filename_download"],
            limit: -1) { id title file { id filename_download modified_on } }
            manuals_aggregated(filter: {file: {filename_download:
            {_starts_with: "rural"}}}) { count { id } } }
        auth_header_env: MCWEB_TOKEN
        token_bundle_url: https://mcweb.apps.prd.cammis.medi-cal.ca.gov/environment.js
        token_bundle_re: 'window\.DIRECTUS_TOKEN\s*=\s*"([^"]+)"'
        note: Per-document monitor for the four RHC/FQHC manual sections
          (rural, ruralcd billing codes, ruralex billing examples, ruralhosp
          swing bed) - full PDF text hash, per-page "Page updated" stamps,
          portal Revision Date, diffs on change. rural.pdf was revised
          2026-07-16, the day before this entry was added. MCSS RHC/FQHC
          email remains the backstop detector.
        registry_note: fqhc-billing reference rows; PPS / wrap / per-visit
          code rows on change

  obstetrics:
    enabled: true
    entries:
      - id: ob_cpsp_manual_docs
        type: manual_list
        method: POST
        url: https://mcweb.apps.prd.cammis.medi-cal.ca.gov/graphql
        asset_base: "https://mcweb.apps.prd.cammis.medi-cal.ca.gov"
        portal_page: https://mcweb.apps.prd.cammis.medi-cal.ca.gov/publications/manual?community=obstetrics
        seed_csv: data/seeds/ob_cpsp_manuals_seed_2026-08-11.csv
        # Filtered manual_list (2026-08-11): Obstetrics (communityId 22) holds
        # 172 sections, too many to watch whole, so this filters that community
        # to filenames starting "pregcom" - exactly the three CPSP sections
        # (pregcom, pregcomexc, pregcomlis). The community filter is load
        # bearing: filtering on the filename alone also returns pregcomexu
        # (CPSP billing examples, UB-04) and pregcomlos (CPSP, Los Angeles
        # County Waiver Facilities), which sit in Clinics and Hospitals (11)
        # and not in Obstetrics. Add them here if they are ever wanted. The
        # aggregate is the truncation tripwire as usual.
        # Manuals are many-to-many with communities: these three sections also
        # belong to Clinics and Hospitals (11) and General Medicine (21), so
        # rev_clinics_hospitals_manuals and rev_general_medicine_manuals name
        # them too when they move. Expect one CPSP revision to surface here in
        # full text and in up to three date-only notices; the full-text row is
        # the one that says what changed.
        graphql_body:
          operationName: CpspManuals
          variables:
            communityId: "22"
          query: >-
            query CpspManuals($communityId: GraphQLStringOrFloat) { manuals(
            filter: {_and: [{community: {communities_id: {id: {_eq:
            $communityId}}}}, {file: {filename_download: {_starts_with:
            "pregcom"}}}]}, sort: ["file.filename_download"], limit: -1) { id
            title file { id filename_download modified_on } }
            manuals_aggregated(filter: {_and: [{community: {communities_id:
            {id: {_eq: $communityId}}}}, {file: {filename_download:
            {_starts_with: "pregcom"}}}]}) { count { id } } }
        auth_header_env: MCWEB_TOKEN
        token_bundle_url: https://mcweb.apps.prd.cammis.medi-cal.ca.gov/environment.js
        token_bundle_re: 'window\.DIRECTUS_TOKEN\s*=\s*"([^"]+)"'
        note: Per-document monitor for the three Comprehensive Perinatal
          Services Program (CPSP) sections of the Obstetrics manual - the
          policy section (preg com), the CMS-1500 billing examples (preg com
          exc) and the list of billing codes. Each is watched individually -
          full PDF text hash, per-page "Page updated" stamps, portal Revision
          Date, diffs on change - so a CPSP code or rate change is reported
          with the changed lines, not just the date. All three were last
          revised 2025-07-16. The rest of the Obstetrics manual is covered
          date-only by rev_obstetrics_manuals. MCSS Obstetrics email remains
          the backstop detector.
        registry_note: CPSP per-visit and support-service billing rows on
          change

  # Date-only watch (revision_watch): reads each community's manual list
  # metadata, no PDF downloads, so it stays light even at 246 sections, and
  # raises a REVISION_NOTICE naming the sections whose Revision Date moved.
  # To upgrade a community to full text monitoring, convert it to a filtered
  # manual_list like fqhc_rural_manual_docs. Community ids: CONTEXT-mcweb.md.
  revision_notices:
    enabled: true
    entries:
      - id: rev_inpatient_manuals
        type: revision_watch
        url: https://mcweb.apps.prd.cammis.medi-cal.ca.gov/graphql
        portal_page: https://mcweb.apps.prd.cammis.medi-cal.ca.gov/publications/manual?community=inpatient-services
        community_id: "9"
        auth_header_env: MCWEB_TOKEN
        token_bundle_url: https://mcweb.apps.prd.cammis.medi-cal.ca.gov/environment.js
        token_bundle_re: 'window\.DIRECTUS_TOKEN\s*=\s*"([^"]+)"'
        note: Inpatient Services manual, ~115 sections. Date-only signal
          for inpatient billing / revenue integrity awareness.
        registry_note: inpatient billing rows on related section changes

      - id: rev_clinics_hospitals_manuals
        type: revision_watch
        url: https://mcweb.apps.prd.cammis.medi-cal.ca.gov/graphql
        portal_page: https://mcweb.apps.prd.cammis.medi-cal.ca.gov/publications/manual?community=clinics-and-hospitals
        community_id: "11"
        auth_header_env: MCWEB_TOKEN
        token_bundle_url: https://mcweb.apps.prd.cammis.medi-cal.ca.gov/environment.js
        token_bundle_re: 'window\.DIRECTUS_TOKEN\s*=\s*"([^"]+)"'
        note: Clinics and Hospitals manual, ~246 sections (includes the
          rural* RHC/FQHC sections that fqhc_rural_manual_docs monitors in
          full - a notice here plus a quiet fqhc row means the movement was
          outside the rural sections).
        registry_note: outpatient clinic / hospital billing rows on related
          section changes

      - id: rev_obstetrics_manuals
        type: revision_watch
        url: https://mcweb.apps.prd.cammis.medi-cal.ca.gov/graphql
        portal_page: https://mcweb.apps.prd.cammis.medi-cal.ca.gov/publications/manual?community=obstetrics
        community_id: "22"
        auth_header_env: MCWEB_TOKEN
        token_bundle_url: https://mcweb.apps.prd.cammis.medi-cal.ca.gov/environment.js
        token_bundle_re: 'window\.DIRECTUS_TOKEN\s*=\s*"([^"]+)"'
        note: Obstetrics manual, 172 sections - the whole community page,
          including pregnancy global and per-visit billing, CPSP, doula
          services, presumptive eligibility and the CCS sections. Date-only
          signal - it names the sections whose Revision Date moved and
          reports sections added or removed, with no PDF download and no text
          diff. The three CPSP sections inside it are monitored in full text
          by ob_cpsp_manual_docs, so a notice here with quiet
          ob_cpsp_manual_docs rows means the movement was outside CPSP.
        registry_note: obstetric and perinatal billing rows on related
          section changes

      - id: rev_general_medicine_manuals
        type: revision_watch
        url: https://mcweb.apps.prd.cammis.medi-cal.ca.gov/graphql
        portal_page: https://mcweb.apps.prd.cammis.medi-cal.ca.gov/publications/manual?community=general-medicine
        community_id: "21"
        auth_header_env: MCWEB_TOKEN
        token_bundle_url: https://mcweb.apps.prd.cammis.medi-cal.ca.gov/environment.js
        token_bundle_re: 'window\.DIRECTUS_TOKEN\s*=\s*"([^"]+)"'
        note: General Medicine manual, ~229 sections - E&M, telehealth,
          preventive services and other chargemaster-relevant policy.
        registry_note: professional-services billing rows on related
          section changes

  ncci:
    enabled: true
    entries:
      - id: ncci_medicaid_files
        type: linkpage
        url: https://www.cms.gov/medicare/coding-billing/ncci-medicaid/medicaid-ncci-edit-files
        link_pattern: 'href="([^"]+\.(?:zip|xlsx)[^"]*)"'
        note: Quarterly PTP/MUE file drops appear as new links (first run
          captured the 2026 Q3 set effective 07/01/2026). File links are
          direct downloads (.zip/.xlsx).
